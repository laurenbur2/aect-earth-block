# AECT lead backend: Cloudflare Worker + D1, free plan. See worker/README.md.
name = "aect-leads"
main = "src/index.js"
compatibility_date = "2025-09-01"

# Serves the whole site too, so the dashboard (/admin/) shares an origin with the API and its
# sign-in cookie. /api/* goes to the Worker; everything else is a static file from ../site.
[assets]
directory = "../site"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "aect-leads"
database_id = "REPLACE_WITH_ID_FROM_wrangler_d1_create"

[vars]
# Testing: Resend's test sender only delivers to the address you signed up to Resend with.
# Going live: a verified AECT address, e.g. "AECT Earth Block <plans@aectearthblock.com>".
EMAIL_FROM = "AECT Earth Block <onboarding@resend.dev>"
ALLOWED_ORIGINS = "https://laurenbur2.github.io,http://localhost:4173"

# Secrets, set with `npx wrangler secret put NAME` (kept out of this public repo):
#   RESEND_API_KEY   from resend.com > API Keys
#   LINK_SECRET      any long random string (signs reach-out links, sign-in links and sessions)
#   NOTIFY_EMAIL     where "new lead" alerts go (comma separated)
#   ADMIN_EMAILS     who can sign in to the dashboard (comma separated)
# For `wrangler dev`, put the same names in worker/.dev.vars (git-ignored).
